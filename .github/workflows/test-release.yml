name: Publish test build
on:
  push:
    branches: [test-builds]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the pre-release (never marked latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(tr -d ' \r\n' < tag.txt)"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists - nothing to do"; exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title "$(cat title.txt)" --notes-file release_notes.md \
            *_Install.bat
