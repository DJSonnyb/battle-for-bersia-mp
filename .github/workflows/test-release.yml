name: Publish test build
on:
  push:
    branches: [test-builds]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update the pre-release (never marked latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(tr -d ' \r\n' < tag.txt)"
          FILES=$(ls *_Install.bat *Crusaders*.bat BattleForBersiaLauncher-*.exe Bersia_Map_Forge.html 2>/dev/null | sort -u)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for a in $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); do
              case " $FILES " in *" $a "*) ;; *) gh release delete-asset "$TAG" "$a" --yes --repo "$GITHUB_REPOSITORY" ;; esac
            done
            gh release upload "$TAG" $FILES --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$(cat title.txt)" --notes-file release_notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false \
              --title "$(cat title.txt)" --notes-file release_notes.md $FILES
          fi
      - name: Official release (created once, never changed afterwards)
        if: hashFiles('stable/tag.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(tr -d ' \r\n' < stable/tag.txt)"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "official release $TAG already exists - left as it is"; exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main --latest \
            --title "$(cat stable/title.txt)" --notes-file stable/release_notes.md stable/*.bat
