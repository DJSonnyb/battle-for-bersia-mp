name: Publish test build
on:
  push:
    tags: ['v*-test*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the pre-release (never marked latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --prerelease --latest=false \
            --title "$(cat title.txt)" --notes-file release_notes.md \
            *_Install.bat
